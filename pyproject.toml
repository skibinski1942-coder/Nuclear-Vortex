[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "achilles-ai"
version = "1.0.0"
description = "Achilles - Advanced AI Assistant Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Nuclear-Vortex", email = "contact@nuclear-vortex.dev"}
]
keywords = [
    "ai",
    "assistant",
    "automation",
    "research",
    "task-management",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]
research = [
    "arxiv>=1.4.0",
    "scholarly>=1.7.0",
    "requests>=2.28.0",
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "transformers>=4.30.0",
]
all = [
    "achilles-ai[dev]",
    "achilles-ai[research]",
    "achilles-ai[ai]",
]

[project.urls]
Homepage = "https://github.com/skibinski1942-coder/Nuclear-Vortex"
Documentation = "https://github.com/skibinski1942-coder/Nuclear-Vortex#readme"
Repository = "https://github.com/skibinski1942-coder/Nuclear-Vortex"
Issues = "https://github.com/skibinski1942-coder/Nuclear-Vortex/issues"

[project.scripts]
achilles = "achilles.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["achilles*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["achilles/tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
